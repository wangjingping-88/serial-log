name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 发布版本，例如 0.1.1
        required: true
        default: 0.3.0
      source_ref:
        description: 可选，检出指定标签或提交进行验证和打包
        required: false
        default: ''
      publish_release:
        description: 全部验证通过后发布指定版本标签的正式 Release
        type: boolean
        required: false
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: 构建发布包
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 计算版本号
        id: version
        shell: pwsh
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          if ($env:PUBLISH_RELEASE -eq 'true' -and $env:SOURCE_REF -ne "v$version") {
            throw '手动发布必须检出与版本号一致的现有标签。'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "assemblyVersion=$version.0" >> $env:GITHUB_OUTPUT

      - name: 还原依赖
        run: dotnet restore SerialLog.sln

      - name: 运行测试
        timeout-minutes: 6
        run: >
          dotnet test SerialLog.sln --no-restore --configuration Release
          --blame-hang-timeout 60s
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=release.trx"
          --results-directory artifacts/test-results
          -- xUnit.ParallelizeTestCollections=false

      - name: 上传测试诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: artifacts/test-results/*
          if-no-files-found: ignore
          retention-days: 7

      - name: 发布 win-x64 便携版
        run: >
          dotnet publish src\SerialLog.App\SerialLog.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts\publish
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.assemblyVersion }}
          -p:FileVersion=${{ steps.version.outputs.assemblyVersion }}
          -p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: 发布单文件更新助手
        run: >
          dotnet publish src\SerialLog.Updater\SerialLog.Updater.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts\updater
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.assemblyVersion }}
          -p:FileVersion=${{ steps.version.outputs.assemblyVersion }}
          -p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: 打包 ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts\release -Force | Out-Null
          Copy-Item artifacts\updater\SerialLog.Updater.exe artifacts\publish\SerialLog.Updater.exe -Force
          $zip = "artifacts\release\SerialLog-v${{ steps.version.outputs.version }}-win-x64-portable.zip"
          Compress-Archive -Path artifacts\publish\* -DestinationPath $zip -Force
          (Get-FileHash -Algorithm SHA256 $zip).Hash | Set-Content "$zip.sha256.txt"
          Remove-Item artifacts\publish\SerialLog.Updater.exe -Force

      - name: 准备签名证书
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $certPath = "artifacts\signing-cert.pfx"
          $cerPath = "artifacts\release\SerialLog-v${{ steps.version.outputs.version }}-win-x64.cer"
          if ($env:WINDOWS_SIGNING_CERT_BASE64) {
            if (-not $env:WINDOWS_SIGNING_CERT_PASSWORD) {
              throw "WINDOWS_SIGNING_CERT_PASSWORD is required when WINDOWS_SIGNING_CERT_BASE64 is configured."
            }
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64) |
              Set-Content -AsByteStream $certPath
            $password = $env:WINDOWS_SIGNING_CERT_PASSWORD
            $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
            $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $certPath,
              $securePassword,
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable)
            [System.IO.File]::WriteAllBytes(
              $cerPath,
              $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          } else {
            $password = [Guid]::NewGuid().ToString("N") + "Aa1!"
            $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
            $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject "CN=SerialLog" `
              -FriendlyName "Serial Log Test Signing" `
              -KeyUsage DigitalSignature `
              -KeyAlgorithm RSA `
              -KeyLength 2048 `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
            Export-PfxCertificate -Cert $cert -FilePath $certPath -Password $securePassword | Out-Null
            Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
          }
          "::add-mask::$password"
          "SIGN_CERT_PATH=$certPath" >> $env:GITHUB_ENV
          "SIGN_CERT_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: 打包 MSIX
        shell: pwsh
        run: |
          .\scripts\package-msix.ps1 `
            -PublishDir artifacts\publish `
            -OutputPath "artifacts\release\SerialLog-v${{ steps.version.outputs.version }}-win-x64.msix" `
            -Version "${{ steps.version.outputs.assemblyVersion }}" `
            -SignCertificatePath $env:SIGN_CERT_PATH `
            -SignCertificatePassword $env:SIGN_CERT_PASSWORD

      - name: 核验发布资产
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $zipPath = "artifacts/release/SerialLog-v$version-win-x64-portable.zip"
          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash
          if ($hash -ne (Get-Content "$zipPath.sha256.txt" -Raw).Trim()) { throw 'ZIP 校验值不匹配。' }
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath))
          try {
            $entries = @($zip.Entries.FullName)
            foreach ($required in @('SerialLog.App.exe', 'SerialLog.App.dll', 'SerialLog.Updater.exe')) {
              if ($entries -notcontains $required) { throw "发布包缺少 $required" }
            }
            if ($entries -match '(^|[/\\])(data|workspace.json)([/\\]|$)' -or $entries -match '\.log$') {
              throw '发布包混入用户配置或日志。'
            }
          } finally { $zip.Dispose() }
          $info = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path 'artifacts/publish/SerialLog.App.dll'))
          if ($info.FileVersion -ne "$version.0") { throw "文件版本不匹配：$($info.FileVersion)" }
          foreach ($suffix in @('msix', 'cer')) {
            if (-not (Test-Path "artifacts/release/SerialLog-v$version-win-x64.$suffix")) { throw "缺少 $suffix 资产" }
          }
          Write-Output "版本=$($info.FileVersion)；SHA256=$hash；更新助手、用户数据隔离及安装包资产核验通过。"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: SerialLog-v${{ steps.version.outputs.version }}-win-x64
          path: artifacts/release/*

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: artifacts/release/*
          body_path: .github/release-notes.md
